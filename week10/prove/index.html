<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipeBook | Find a Recipe</title>
  <meta name="description" content="RecipeBook: search simple, delicious recipes by name, description, or tag.">
  <meta name="author" content="Anand Francis">

  <meta property="og:type" content="website">
  <meta property="og:title" content="RecipeBook">
  <meta property="og:description" content="Search simple, delicious recipes by name, description, or tag.">
  <meta property="og:url" content="https://githubusername.github.io/wdd131/recipes/">
  <meta property="og:image" content="https://githubusername.github.io/wdd131/recipes/images/social-preview-image.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="RecipeBook">
  <meta name="twitter:description" content="Search simple, delicious recipes by name, description, or tag.">
  <meta name="twitter:image" content="https://githubusername.github.io/wdd131/recipes/images/social-preview-image.png">

  <link rel="icon" href="images/favicon.ico">

  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <img src="images/recipe-book.png" alt="" width="70" height="70">
      <span class="site-title">RecipeBook</span>
    </a>
  </header>

  <main>
    <h1 class="visually-hidden">Find a Recipe</h1>

    <search class="search">
      <form action="#" method="get">
        <label for="search-input" class="visually-hidden">Find a recipe</label>
        <input type="search" id="search-input" name="q" placeholder="Find a recipe">
        <button type="submit" aria-label="Search">
          <img src="images/search.svg" alt="" width="24" height="24">
        </button>
      </form>
    </search>

    <section class="recipe-list"></section>
  </main>

  <footer>
    <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>

    <div class="social">
      <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon" width="24" height="24"></a>
      <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon" width="24" height="24"></a>
      <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon" width="24" height="24"></a>
    </div>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FSY counselor campus preferences and availability.">
  <title>FSY Counselor Preference Form</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232b553b'/%3E%3Ctext x='32' y='43' font-size='40' text-anchor='middle' fill='white'%3EF%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="form.css">
  <script src="form.js" defer></script>
</head>

<body>
  <main class="wrapper">
    <h1>FSY Counselor Preference Form</h1>

    <form id="fsyForm">
      <div class="field">
        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" type="text"
               autocomplete="given-name" required>
      </div>

      <div class="field">
        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" type="text"
               autocomplete="family-name" required>
      </div>

      <div class="field full">
        <label for="email">Email</label>
        <input id="email" name="email" type="email"
               autocomplete="email" required>
      </div>

      <div class="field">
        <label for="travelRange">Willing to Serve In</label>
        <select id="travelRange" name="travelRange"
                aria-controls="notesContainer" required>
          <option value="">Choose one</option>
          <option value="one">One campus</option>
          <option value="many">Two or more campuses</option>
        </select>
      </div>

      <div class="field">
        <label for="availableDate">Available Start Date</label>
        <input id="availableDate" name="availableDate"
               type="date" required>
      </div>

      <fieldset class="full campus-group">
        <legend>Campuses you are willing to serve at</legend>

        <div class="campus-grid">
          <label>
            <input type="checkbox" name="campus"
                   value="BYU - Provo, Utah">
            Brigham Young University (BYU) - Provo, Utah
          </label>

          <label>
            <input type="checkbox" name="campus"
                   value="BYU-Idaho - Rexburg, Idaho">
            Brigham Young University-Idaho (BYU-Idaho) - Rexburg, Idaho
          </label>

          <label>
            <input type="checkbox" name="campus"
                   value="Southern Virginia University - Buena Vista, Virginia">
            Southern Virginia University - Buena Vista, Virginia
          </label>

          <label>
            <input type="checkbox" name="campus"
                   value="University of Maryland - College Park, Maryland">
            University of Maryland - College Park, Maryland
          </label>

          <label>
            <input type="checkbox" name="campus"
                   value="University of North Georgia - Dahlonega, Georgia">
            University of North Georgia - Dahlonega, Georgia
          </label>

          <label>
            <input type="checkbox" name="campus"
                   value="San Diego State University - San Diego, California">
            San Diego State University - San Diego, California
          </label>

          <label>
            <input type="checkbox" name="campus"
                   value="University of Idaho - Moscow, Idaho">
            University of Idaho - Moscow, Idaho
          </label>

          <label>
            <input type="checkbox" name="campus"
                   value="Utah State University - Logan, Utah">
            Utah State University - Logan, Utah
          </label>

          <label>
            <input type="checkbox" name="campus"
                   value="Pacific Lutheran University - Tacoma, Washington">
            Pacific Lutheran University - Tacoma, Washington
          </label>

          <label>
            <input type="checkbox" name="campus"
                   value="Stetson University - DeLand, Florida">
            Stetson University - DeLand, Florida
          </label>
        </div>
      </fieldset>

      <div id="notesContainer" class="field full" hidden>
        <label for="notes">Travel Notes (required for multiple campuses)</label>
        <input id="notes" name="notes" type="text" disabled>
      </div>

      <button class="full" type="submit">Submit Preferences</button>
    </form>

    <section id="output" aria-live="polite" aria-atomic="true"></section>
  </main>
</body>
</html>

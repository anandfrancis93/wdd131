<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create an event ticket for a student or guest.">
  <title>Event Ticket</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="wrapper">
    <h1>Event Ticket</h1>

    <!-- JS displays validation messages below the form. -->
    <form id="ticketForm" novalidate>
      <div class="field">
        <label for="firstName">First Name</label>
        <input
          id="firstName"
          name="firstName"
          type="text"
          autocomplete="given-name"
          minlength="1"
          maxlength="50"
          required
        >
      </div>

      <div class="field">
        <label for="lastName">Last Name</label>
        <input
          id="lastName"
          name="lastName"
          type="text"
          autocomplete="family-name"
          minlength="1"
          maxlength="50"
          required
        >
      </div>

      <div class="field full">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          maxlength="254"
          required
        >
      </div>

      <div class="field">
        <label for="attendeeType">Type</label>
        <select
          id="attendeeType"
          name="attendeeType"
          aria-controls="credentialContainer"
          required
        >
          <option value="">Choose one</option>
          <option value="student">Student</option>
          <option value="guest">Guest</option>
        </select>
      </div>

      <div class="field">
        <label for="eventDate">Event Date</label>
        <input
          id="eventDate"
          name="eventDate"
          type="date"
          required
        >
      </div>

      <div id="credentialContainer" class="field full" hidden>
        <label id="credentialLabel" for="credential">Student I#</label>
        <input
          id="credential"
          name="credential"
          type="text"
          minlength="9"
          maxlength="9"
          pattern="[0-9]{9}"
          aria-describedby="credentialHelp"
          required
          disabled
        >
        <small id="credentialHelp">Enter your 9-digit student I number.</small>
      </div>

      <button class="full" type="submit">Create Ticket</button>
    </form>

    <section
      id="output"
      aria-live="polite"
      aria-atomic="true"
    ></section>
  </main>
</body>
</html>

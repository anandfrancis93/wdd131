<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipeBook | Apple Crisp</title>
  <meta name="description" content="RecipeBook: find simple, delicious recipes like our warm apple crisp.">
  <meta name="author" content="Anand Francis">

  <!-- Open Graph (Facebook, LinkedIn, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="RecipeBook">
  <meta property="og:description" content="Find simple, delicious recipes like our warm apple crisp.">
  <meta property="og:url" content="https://githubusername.github.io/wdd131/recipes/">
  <meta property="og:image" content="https://githubusername.github.io/wdd131/recipes/images/social-preview-image.png">

  <!-- X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="RecipeBook">
  <meta name="twitter:description" content="Find simple, delicious recipes like our warm apple crisp.">
  <meta name="twitter:image" content="https://githubusername.github.io/wdd131/recipes/images/social-preview-image.png">

  <!-- One favicon (ICO works everywhere) -->
  <link rel="icon" href="images/favicon.ico">

  <!-- One Apple Touch Icon (iOS home screen) -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <!-- Google Font: Amatic SC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <img src="images/recipe-book.png" alt="" width="70" height="70">
      <span class="site-title">RecipeBook</span>
    </a>
  </header>

  <main>
    <search class="search">
      <form action="#" method="get">
        <label for="search-input" class="visually-hidden">Find a recipe</label>
        <input type="search" id="search-input" name="q" placeholder="Find a recipe">
        <button type="submit" aria-label="Search">
          <img src="images/search.svg" alt="" width="24" height="24">
        </button>
      </form>
    </search>

    <article class="recipe">
      <img class="recipe-img" src="images/apple-crisp.jpg"
           alt="Apple crisp in a white bowl topped with vanilla ice cream"
           width="500" height="375">

      <div class="recipe-info">
        <ul class="tags">
          <li><button type="button">dessert</button></li>
        </ul>

        <h1 class="recipe-title">Apple Crisp</h1>

        <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star-empty">☆</span>
        </span>

        <p class="description">
          This apple crisp recipe is a simple yet delicious fall dessert
          that's great served warm with vanilla ice cream.
        </p>
      </div>
    </article>
  </main>

  <footer>
    <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>

    <div class="social">
      <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates -->
      <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon" width="24" height="24"></a>
      <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon" width="24" height="24"></a>
      <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon" width="24" height="24"></a>
    </div>
  </footer>
</body>
</html>
